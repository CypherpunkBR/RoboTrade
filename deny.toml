# Cargo Deny Configuration for RoboTrade
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Security vulnerability database
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]

# Ignore specific advisories if needed (Tauri/GTK3 dependencies)
ignore = [
    # Add advisory IDs here if needed
]

[licenses]
# License compliance
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of same dependency
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
