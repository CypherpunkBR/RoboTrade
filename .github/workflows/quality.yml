name: Quality Gates

on:
  push:
    branches: [main, master, stage/2]
  pull_request:
    branches: [main, master]

jobs:
  rust-quality:
    name: Rust Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy (all crates)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery

      - name: Rust build check
        run: cargo check --workspace --all-targets --all-features

      - name: Rust tests (all crates)
        run: cargo test --workspace --all-features

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [rust-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --workspace --all-features --out xml --output-dir ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

      - name: Run cargo deny
        run: cargo deny check
        continue-on-error: true

  dependencies:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-machete
        run: cargo install cargo-machete

      - name: Check for unused dependencies
        run: cargo machete
        continue-on-error: true

      - name: Check for duplicate dependencies
        run: cargo tree --workspace --duplicates
        continue-on-error: true

  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release (all crates)
        run: cargo build --workspace --release --all-features

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [rust-quality, build]

    steps:
      - name: All checks passed
        run: echo "✅ All quality gates passed!"
