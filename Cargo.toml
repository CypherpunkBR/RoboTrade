# RoboTrade - Robô de Trade em Rust
# Workspace principal contendo todos os crates do projeto

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/market_data",
    "crates/analytics",
    "crates/trading_worker",
    "crates/exchange_gateways",
    "crates/infra",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CypherpunkBR"]
license = "MIT"
repository = "https://github.com/CypherpunkBR/RoboTrade"

[workspace.dependencies]
# Runtime assíncrono
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Banco de dados SQLite
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Tratamento de erros
thiserror = "1.0"
anyhow = "1.0"

# Logging estruturado
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Cliente HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Matemática decimal (precisão para valores financeiros)
rust_decimal = { version = "1.33", features = ["serde"] }
rust_decimal_macros = "1.33"

# Data e hora
chrono = { version = "0.4", features = ["serde"] }

# Segurança
keyring = "3"
secrecy = { version = "0.8", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Encoding
urlencoding = "2.1"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Utilitários
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"
futures = "0.3"
tokio-stream = "0.1"
directories = "5.0"

# Validação
validator = { version = "0.18", features = ["derive"] }

# Configuração
config = "0.14"
dotenvy = "0.15"

# Testes
mockall = "0.12"
rstest = "0.18"
tokio-test = "0.4"
tempfile = "3.10"
wiremock = "0.6"

# Tauri
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0" }

# Crates internos
robotrade-core = { path = "crates/core" }
robotrade-market-data = { path = "crates/market_data" }
robotrade-analytics = { path = "crates/analytics" }
robotrade-trading-worker = { path = "crates/trading_worker" }
robotrade-exchange-gateways = { path = "crates/exchange_gateways" }
robotrade-infra = { path = "crates/infra" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
