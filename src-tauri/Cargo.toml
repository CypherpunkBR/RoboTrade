[package]
name = "robotrade-app"
version = "0.1.0"
edition = "2021"
description = "RoboTrade - Trading Robot Desktop App"
license = "MIT"

[lib]
name = "robotrade_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Crates internas
robotrade-core = { path = "../crates/core" }
robotrade-infra = { path = "../crates/infra" }
robotrade-market-data = { path = "../crates/market_data" }
robotrade-exchange-gateways = { path = "../crates/exchange_gateways" }
robotrade-trading-worker = { path = "../crates/trading_worker" }

# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"

# Async
tokio = { workspace = true }

# Serialização
serde = { workspace = true }
serde_json = { workspace = true }

# Tipos
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Sync
parking_lot = { workspace = true }
once_cell = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
